services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lazup
      POSTGRES_USER: lazup
      POSTGRES_PASSWORD: lazup_dev_password
    ports: ["5432:5432"]
    volumes:
      - lazup_pgdata:/var/lib/postgresql/data
      - ./backend/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lazup -d lazup"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  lazup_pgdata:
